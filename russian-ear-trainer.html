<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Russian">
<title>Russian ear trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--card:#fff;--ink:#14213d;--mute:#5b6b85;--acc:#2b50aa;--accsoft:#dbe5fa;--onacc:#fff;--ok:#1f8a5b;--bad:#c23b3b;--line:#cfd9e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1626;--card:#18223a;--ink:#e8eefb;--mute:#9fb0cf;--acc:#8fb0ff;--accsoft:#243557;--onacc:#0f1626;--ok:#4cc38a;--bad:#ff7a7a;--line:#2c3a5a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1626;--card:#18223a;--ink:#e8eefb;--mute:#9fb0cf;--acc:#8fb0ff;--accsoft:#243557;--onacc:#0f1626;--ok:#4cc38a;--bad:#ff7a7a;--line:#2c3a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.25rem;font-weight:800;margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--accsoft);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:10px;border-radius:9px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px}
.prompt{text-align:center;font-weight:800;line-height:1.1;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.prompt .big{font-size:5.5rem}
.prompt .word{font-size:3rem}
.prompt .tr{font-size:1rem;font-weight:400;color:var(--mute);min-height:1.2em}
.play{display:block;margin:6px auto 18px;border:1px solid var(--line);background:var(--accsoft);border-radius:999px;padding:10px 18px;font-weight:600;display:flex;gap:8px;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 8px;font-weight:600;font-size:1.05rem;min-height:56px}
.opts button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opts button:disabled{cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--mute);font-size:.95rem;gap:10px}
.next{border:0;background:var(--acc);color:var(--onacc);border-radius:10px;padding:10px 20px;font-weight:600}
.next[hidden]{display:none}
label{display:flex;gap:8px;align-items:center}
.note{color:var(--mute);font-size:.85rem;margin-top:14px}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accsoft);font-size:.95rem;line-height:1.45}
.why:empty{display:none}
.why b{font-weight:600}
details.card{margin-top:14px;padding:14px 18px}
summary{font-weight:600;cursor:pointer}
.trw{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.trk{font-weight:800;font-size:1.2rem}
.trc{color:var(--mute);font-size:.85rem}
.trbtns{display:flex;gap:10px;margin-top:12px}
.ghost{border:1px solid var(--line);background:transparent;border-radius:10px;padding:10px 16px;font-weight:600}
.play[hidden]{display:none}
label[hidden]{display:none}
.spd{justify-content:center;margin:-8px 0 16px;color:var(--mute);font-size:.95rem}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
</style>
</head>
<body>
<main>
<h1>Russian ear trainer</h1>
<div class="tabs" role="group" aria-label="Mode">
  <button id="tL" aria-pressed="true">Letters</button>
  <button id="tW" aria-pressed="false">Words</button>
  <button id="tR" aria-pressed="false">Reverse</button>
</div>
<div class="card">
  <div class="prompt" id="prompt"></div>
  <button class="play" id="play" aria-label="Play audio"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>Play</button>
  <label class="spd">Speed <select id="rate"><option value=".55">Slow</option><option value=".8" selected>Normal</option><option value="1">Fast</option></select></label>
  <div class="opts" id="opts"></div>
  <div class="why" id="why" aria-live="polite"></div>
  <div class="row">
    <span id="score">0 of 0 correct</span>
    <label id="lo" hidden><input type="checkbox" id="listen"> Listen only</label>
    <button class="next" id="next" hidden>Next</button>
  </div>
</div>
<details class="card" id="trbox"><summary>Trouble list</summary><div id="tl"></div><div class="trbtns"><button class="next" id="foc" aria-pressed="false">Practice trouble items</button><button class="ghost" id="clr">Clear</button></div></details>
<p class="note">Tap Play to hear it. Missed items come back a few cards later. If you hear nothing, your device may not have a Russian voice installed.</p>
</main>
<script>
const L=[["А","a"],["Б","b"],["В","v"],["Г","g"],["Д","d"],["Е","ye"],["Ё","yo"],["Ж","zh"],["З","z"],["И","ee"],["Й","y (short)"],["К","k"],["Л","l"],["М","m"],["Н","n"],["О","o"],["П","p"],["Р","r"],["С","s"],["Т","t"],["У","oo"],["Ф","f"],["Х","kh"],["Ц","ts"],["Ч","ch"],["Ш","sh"],["Щ","shch"],["Ы","ih"],["Э","e"],["Ю","yu"],["Я","ya"]];
const W=[["привет","hi","pree-VYET"],["пока","bye","pa-KA"],["да","yes","da"],["нет","no","nyet"],["спасибо","thank you","spa-SEE-ba"],["пожалуйста","please / you’re welcome","pa-ZHAL-sta"],["здравствуйте","hello (formal)","ZDRAHST-vooy-tye"],["я","I","ya"],["ты","you (informal)","tih"],["мы","we","mih"],["вода","water","va-DA"],["хлеб","bread","khlyep"],["метро","metro","myet-RO"],["дом","house","dom"],["друг","friend","drook"],["мама","mom","MA-ma"],["папа","dad","PA-pa"],["хорошо","good / OK","kha-ra-SHO"],["извините","excuse me","eez-vee-NEE-tye"],["кофе","coffee","KO-fye"],["один","one","a-DEEN"],["два","two","dva"],["три","three","tree"],["четыре","four","chye-TIH-rye"],["пять","five","pyat"],["где","where","gdye"],["что","what","shto"],["почему","why","pa-chye-MOO"],["это","this / it is","E-ta"],["как дела","how are you","kak dye-LA"],["чай","tea","chai"],["молоко","milk","ma-la-KO"],["суп","soup","soop"],["яблоко","apple","YA-bla-ka"],["рыба","fish","RIH-ba"],["кот","cat","kot"],["собака","dog","sa-BA-ka"],["сегодня","today","sye-VOD-nya"],["завтра","tomorrow","ZAF-tra"],["люблю","I love","lyub-LYU"]];
const EX={"А":"арбуз","Б":"брат","В":"вода","Г":"гора","Д":"дом","Е":"лето","Ё":"ёлка","Ж":"жук","З":"зима","И":"игра","Й":"мой","К":"кот","Л":"лампа","М":"мама","Н":"нос","О":"окно","П":"папа","Р":"рыба","С":"сок","Т":"тигр","У":"утка","Ф":"фото","Х":"хлеб","Ц":"цирк","Ч":"чай","Ш":"шапка","Щ":"щи","Ы":"мы","Э":"это","Ю":"юг","Я":"яблоко"};
const say=()=>speak(mode==="L"?EX[cur[0]]:cur[0].toLowerCase());
const TIP={"В":"Looks like B, but it sounds like V.","Н":"Looks like H, but it sounds like N.","Р":"Looks like P, but it sounds like a rolled R.","С":"Looks like C, but it sounds like S.","У":"Looks like y, but it sounds like “oo”.","Х":"Looks like X, but it’s a breathy “kh”, like “loch”.","П":"Looks like n, but it sounds like P.","Й":"A quick “y”, like the end of “boy”. Not the same as И, which is “ee”.","И":"Sounds like “ee” in “see”.","Ы":"A tricky vowel with no English match: “ih”, with the tongue pulled back.","Э":"Like the “e” in “met”. Unlike Е, it has no y glide.","Е":"Starts with a y glide, like “ye” in “yes”.","Ж":"Like the “s” in “measure”.","Щ":"Like a soft “sh” followed by “ch”.","Ч":"Like “ch” in “chair”.","Ц":"Like the “ts” in “cats”.","Я":"Like “ya” in “yacht”.","Ю":"Like “you”.","Ё":"Like “yo” in “yoga”.","Г":"A hard “g”, as in “go”.","Ш":"Like “sh” in “ship”."};
const WN={"привет":"Informal, so use it with friends.","здравствуйте":"The formal hello, for strangers or anyone you want to be polite to.","ты":"Informal “you”. The formal one is вы.","я":"Only capitalized at the start of a sentence, like any other word.","пожалуйста":"It covers both “please” and “you’re welcome”.","метро":"Same word as English, but stress the end: myet-RO.","нет":"Said “nyet”, with a y glide after the n.","как дела":"Literally “how are things”, a casual way to ask how someone is.","мы":"The ы is the tricky vowel: “ih”, with the tongue pulled back.","хлеб":"The х is a breathy “kh”, and the final б is said like “p”.","что":"The ч is pronounced “sh” here, so it sounds like “shto”.","чай":"Rhymes with “eye”.","сегодня":"The г is pronounced like “v” here: sye-VOD-nya.","почему":"Stress is on the last syllable: pa-chye-MOO.","это":"Starts with э, which is just “e” without a y glide."};
let st={};try{st=JSON.parse(localStorage.getItem("ruTrainer")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("ruTrainer",JSON.stringify(st))}catch(e){}};
let focus=false;
const rank=()=>[...L,...W].filter(i=>st[i[0]]&&st[i[0]][1]>0).sort((a,b)=>{const f=i=>st[i[0]][1]/(st[i[0]][0]+st[i[0]][1]);return f(b)-f(a)||st[b[0]][1]-st[a[0]][1]});
function renderTrouble(){
  const r=rank().slice(0,10);
  $("tl").innerHTML=r.length?r.map(i=>{const s=st[i[0]];const isL=L.includes(i);return `<div class="trw"><span class="trk">${i[0]}</span><span>${isL?"“"+i[1]+"”":i[1]}</span><span class="trc">missed ${s[1]} of ${s[0]+s[1]}</span></div>`}).join(""):"<p class=\"note\">Nothing yet. Letters and words you miss will show up here.</p>";
  $("foc").textContent=focus?"Trouble practice: on":"Practice trouble items";
  $("foc").setAttribute("aria-pressed",focus);
}
function explain(o,good){
  if(mode==="L"){
    const t=TIP[cur[0]]||"";
    const base=`${cur[0]} sounds like “${cur[1]}”, as in ${EX[cur[0]]}. ${t}`;
    return good?`<b>Right.</b> ${base}`:`<b>Not quite.</b> “${o[1]}” is the sound of ${o[0]}. ${base}`;
  }
  const n=WN[cur[0]]||"";
  if(mode==="R")return good?`<b>Right.</b> “${cur[1]}” is ${cur[0]} (${cur[2]}). ${n}`:`<b>Not quite.</b> You picked ${o[0]}, which means “${o[1]}”. “${cur[1]}” is ${cur[0]} (${cur[2]}). ${n}`;
  return good?`<b>Right.</b> ${cur[0]} (${cur[2]}) means “${cur[1]}”. ${n}`:`<b>Not quite.</b> You picked “${o[1]}”, which is ${o[0]}. ${cur[0]} (${cur[2]}) means “${cur[1]}”. ${n}`;
}
const $=id=>document.getElementById(id);
let mode="L",cur=null,queue=[],right=0,total=0,answered=false;
function speak(t){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=parseFloat($("rate").value);speechSynthesis.speak(u)}catch(e){}}
const pool=()=>mode==="L"?L:W;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function show(){
  const listenOnly=mode==="W"&&$("listen").checked&&!answered;
  $("play").hidden=mode==="R"&&!answered;
  $("prompt").innerHTML=mode==="R"?`<span class="word">${cur[1]}</span><span class="tr">${answered?cur[0]+" ("+cur[2]+")":"Pick the Russian word"}</span>`:mode==="L"
    ?`<span class="big">${cur[0]}</span><span class="tr">as in ${EX[cur[0]]}</span>`
    :`<span class="word">${listenOnly?"?":cur[0]}</span><span class="tr">${listenOnly?"Listen, then pick the meaning":cur[2]}</span>`;
}
function next(){
  answered=false;$("next").hidden=true;$("why").innerHTML="";
  const p=pool();let it;
  const tp=focus?rank().filter(i=>p.includes(i)).slice(0,8):[];
  if(queue.length&&Math.random()<.5)it=queue.shift();
  else if(tp.length>1||(tp.length&&tp[0]!==cur)){do{it=tp[Math.floor(Math.random()*tp.length)]}while(it===cur&&tp.length>1)}
  else{do{it=p[Math.floor(Math.random()*p.length)]}while(it===cur&&p.length>1)}
  cur=it;
  const others=shuffle(p.filter(x=>x!==cur)).slice(0,3);
  const opts=shuffle([cur,...others]);
  $("opts").innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");b.textContent=o[mode==="R"?0:1];
    b.onclick=()=>answer(b,o);$("opts").appendChild(b);
  });
  show();
  if(total>0&&mode!=="R")say();
}
function answer(btn,o){
  if(answered)return;answered=true;total++;
  const good=o===cur;
  if(good)right++;else queue.push(cur);
  (st[cur[0]]=st[cur[0]]||[0,0])[good?0:1]++;save();renderTrouble();
  [...$("opts").children].forEach(b=>{
    b.disabled=true;
    if(b.textContent===cur[mode==="R"?0:1])b.classList.add("ok");
  });
  if(!good)btn.classList.add("bad");
  $("score").textContent=`${right} of ${total} correct`;
  $("why").innerHTML=explain(o,good);
  $("next").hidden=false;$("next").focus();if(mode==="R")speak(cur[0]);
  show();
}
function setMode(m){
  mode=m;queue=[];cur=null;
  $("tL").setAttribute("aria-pressed",m==="L");
  $("tW").setAttribute("aria-pressed",m==="W");
  $("tR").setAttribute("aria-pressed",m==="R");
  $("lo").hidden=m!=="W";
  next();
}
$("tL").onclick=()=>setMode("L");
$("tW").onclick=()=>setMode("W");
$("tR").onclick=()=>setMode("R");
$("next").onclick=next;
$("play").onclick=say;
$("rate").onchange=()=>{if(!$("play").hidden)say()};
$("foc").onclick=()=>{focus=!focus;renderTrouble();next()};
$("clr").onclick=()=>{st={};save();renderTrouble()};
renderTrouble();
$("listen").onchange=()=>{show();if(mode==="W")speak(cur[0])};
next();
</script>
</body>
</html>
